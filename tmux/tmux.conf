# ===== PLUGINS (TPM must be last) =====
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tpm'

# ===== PREFIX =====
# C-a is home-row ergonomic on Mac; C-b is a painful stretch
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ===== GENERAL =====
set -g mouse on
set -g status on
set -g focus-events on
set -g history-limit 50000
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g repeat-time 500
set -g status-interval 2

# ===== TERMINAL / COLOR =====
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -ga terminal-overrides ",*256col*:Tc"

# Passthrough for images, hyperlinks, OSC52 clipboard
set -g allow-passthrough all
set -ga terminal-features ",*:hyperlinks"
set -s set-clipboard on
set -s extended-keys on
bind -n S-Enter send-keys -l "\x1b[13;2u"

# ===== VI COPY MODE (the big macOS fix) =====
setw -g mode-keys vi

# v to select, C-v for rectangle, V for line, y to yank → pbcopy
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi V   send-keys -X select-line
bind-key -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Mouse drag → system clipboard via pbcopy; stay in copy mode so you can
# extend/adjust the selection before pressing Enter or y to confirm.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"

# Double-click to select & copy word, triple-click for whole line
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe "pbcopy"
bind-key -T root         DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe "pbcopy" }
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe "pbcopy"
bind-key -T root         TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe "pbcopy" }

# Right-click paste from macOS clipboard
bind-key -T root MouseDown3Pane run "pbpaste | tmux load-buffer - ; tmux paste-buffer"

# Paste from macOS clipboard
bind-key p run "pbpaste | tmux load-buffer - ; tmux paste-buffer"

# ===== PANE NAVIGATION =====
# Option/Alt+Arrow doesn't work on macOS without terminal-level config.
# Instead: vim-style hjkl with prefix — works everywhere, no terminal hacks.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ===== PANE SPLITS =====
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ===== WINDOW BINDINGS =====
bind c new-window -c "#{pane_current_path}"
bind r command-prompt "rename-session %%"

# Quick window switching: prefix + number is default,
# but also allow Shift-arrow to cycle windows (no prefix needed)
bind -n S-Left  previous-window
bind -n S-Right next-window

# ===== PANE SYNCHRONIZATION =====
bind y setw synchronize-panes
setw -g window-status-current-format '#{?pane_synchronized,#[bg=red],}#I:#W'
setw -g window-status-format         '#{?pane_synchronized,#[bg=red],}#I:#W'

# ===== CONFIG RELOAD =====
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# ===== THEME TOGGLE =====
bind-key C-d source-file ~/.tmux/dracula-dark.conf \; display-message "Dark theme loaded"
# C-l conflicts with "clear screen" in many shells; use C-g for light
bind-key C-g source-file ~/.tmux/dracula-light.conf \; display-message "Light theme loaded"

# ===== APPEARANCE =====
set -g pane-border-style 'fg=#44475a,bg=default'
set -g pane-active-border-style 'fg=#50fa7b,bg=default,bold'
set -g pane-border-lines heavy

# Dracula window color customization (dimmed inactive tabs)
set -g @dracula-window-status-fg '#959591'
set -g @dracula-window-status-bg '#292b36'
set -g @dracula-window-status-current-fg '#f8f8f2'
set -g @dracula-window-status-current-bg '#44475a'

# Dracula status bar
set -g @dracula-show-powerline false
set -g @dracula-show-left-icon session
set -g @dracula-plugins "custom:ax_status.sh cpu-usage ram-usage network-bandwidth custom:disk_space.sh time battery"
set -g @dracula-custom-plugin-colors "dark_gray orange"
set -g @dracula-show-location false
set -g @dracula-border-contrast true
set -g @dracula-synchronize-panes-label "Sync"
set -g @dracula-network-bandwidth-show-interface true

# macOS: detect primary interface via route (Linux `ip` doesn't exist here)
run-shell "tmux set-option -g @dracula-network-bandwidth \"$(route -n get default 2>/dev/null | awk '/interface:/{print $2}')\""

set -g @dracula-battery-label ""
set -g @dracula-battery-colors "gray orange"
set -g @dracula-cpu-usage-colors "dark_gray orange"
set -g @dracula-ram-usage-colors "dark_gray orange"
set -g @dracula-time-colors "dark_gray orange"
set -g @dracula-git-colors "dark_gray green"
set -g @dracula-military-time true
set -g @dracula-time-format "%H:%M:%S"

# Continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# tmux-better-mouse-mode settings
set -g @scroll-speed-num-lines-per-scroll 3
set -g @scroll-without-changing-pane on
set -g @emulate-scroll-for-no-mouse-alternate-buffer on

# Load theme-specific configuration (light or dark)
run-shell "if [ \"$TMUX_THEME\" = \"light\" ]; then tmux source-file ~/.tmux/dracula-light.conf; else tmux source-file ~/.tmux/dracula-dark.conf; fi"

# ===== AX AGENT MANAGER =====
source-file ~/.tmux/agents.conf

# Auto-install TPM if missing
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# TPM init — always last
run '~/.tmux/plugins/tpm/tpm'
