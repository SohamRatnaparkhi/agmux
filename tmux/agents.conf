# ===== agmux: agent manager layer =====
# prefix+a  → agent picker (fuzzy, blocked-first, live preview)
# prefix+n  → spawn agent: pick repo → agent → new/resume
# prefix+A  → spawn agent HERE (current repo, skips the repo picker)
# prefix+m  → tap-friendly menu (new / here / sweep / jump / ○ restart)
# prefix+e  → resume a past session in the same CLI
# prefix+x  → sweep inactive agents and leftover agent-only sessions
# Mouse is required for status-bar taps and single-tap fzf rows.
set -g mouse on
# Drop the old left/right split. Those hit boxes were too small to tap, and
# the left bind ran `agmux menu` in the current pane (fzf over an agent).
unbind -n MouseUp1StatusLeft
unbind -n MouseUp1StatusRight

# Full-size popups so phone taps hit a whole row, not a 12-pixel menu item.
# -d keeps "spawn here" in the pane you opened the popup from.
# run-shell follow after -E so landing survives the popup closing
bind a display-popup -E -d "#{pane_current_path}" -w 100% -h 100% "agmux" \; run-shell "agmux follow"
bind n display-popup -E -d "#{pane_current_path}" -w 100% -h 100% "agmux new" \; run-shell "agmux follow"
bind A display-popup -E -d "#{pane_current_path}" -w 100% -h 100% "agmux here" \; run-shell "agmux follow"
bind m display-popup -E -d "#{pane_current_path}" -w 100% -h 100% "agmux menu" \; run-shell "agmux follow"
bind e display-popup -E -d "#{pane_current_path}" -w 100% -h 100% "agmux resume" \; run-shell "agmux follow"
bind w display-popup -E -d "#{pane_current_path}" -w 100% -h 100% "agmux search"
unbind i
bind x run-shell "agmux sweep"

# Claude Code's native binary names its process after its version ("2.1.233"),
# which is what automatic-rename displays. Map digit-leading commands → claude.
setw -g automatic-rename-format '#{?#{m:[0-9]*,#{pane_current_command}},claude,#{pane_current_command}}'

# Mobile: the whole status bar is one tap target. Splitting left/right made
# the session-name hit box too small to press on a phone.
# NB: must bind mouse-UP, not down — a touch tap's release event would
# instantly close a menu opened on MouseDown (verified on tmux 3.6a).
bind -n MouseUp1Status display-popup -E -d "#{pane_current_path}" -w 100% -h 100% "agmux menu"
