# ===== agmux: agent manager layer =====
# prefix+a  → agent picker (fuzzy, blocked-first, live preview)
# prefix+n  → spawn agent: pick repo → agent → worktree
# prefix+A  → spawn agent HERE (current repo, skips the repo picker)
# prefix+m  → tap-friendly agent menu (same as tapping the status bar)
bind a display-popup -E -w 95% -h 80% "agmux"
bind n display-popup -E -w 90% -h 75% "agmux new"
bind A display-popup -E -d "#{pane_current_path}" -w 90% -h 75% "agmux here"
bind m run-shell "agmux menu"

# Claude Code's native binary names its process after its version ("2.1.233"),
# which is what automatic-rename displays. Map digit-leading commands → claude.
setw -g automatic-rename-format '#{?#{m:[0-9]*,#{pane_current_command}},claude,#{pane_current_command}}'

# Mobile: tap the status bar instead of chording.
# Left side (session name) → agent menu; right side (widgets) → full picker.
# NB: must bind mouse-UP, not down — a touch tap's release event would
# instantly close a menu opened on MouseDown (verified on tmux 3.6a).
bind -n MouseUp1StatusLeft  run-shell "agmux menu"
bind -n MouseUp1StatusRight display-popup -E -w 95% -h 80% "agmux"
